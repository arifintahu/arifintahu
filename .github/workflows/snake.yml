name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily, 07:00 UTC+7
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Draws the snake over the contribution graph in the site's ember palette.
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#C2410C&color_dots=#ebedf0,#fbd5c2,#f6a77f,#e5733f,#C2410C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF8A5B&color_dots=#161b22,#4a2416,#7a3315,#b8460f,#FF8A5B

      # Publishes the SVGs to the `output` branch the README points at.
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
